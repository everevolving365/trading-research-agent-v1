# Correlation groups drive the hedge refusal (hard rule 3). Two instruments in
# correlated groups with opposing exposure is a hedge even when the symbols
# differ -- long NQ on one account and short ES on another IS a hedge.
correlation_matrix:
  nasdaq:   {sp500: 0.92, nasdaq: 1.0, crypto_major: 0.45, energy: 0.10, fx_eur: -0.05}
  sp500:    {nasdaq: 0.92, sp500: 1.0, crypto_major: 0.42, energy: 0.15, fx_eur: -0.05}
  crypto_major: {nasdaq: 0.45, sp500: 0.42, crypto_major: 1.0, energy: 0.05, fx_eur: 0.10}
  energy:   {nasdaq: 0.10, sp500: 0.15, crypto_major: 0.05, energy: 1.0, fx_eur: 0.05}
  fx_eur:   {nasdaq: -0.05, sp500: -0.05, crypto_major: 0.10, energy: 0.05, fx_eur: 1.0}

# Above this absolute correlation, opposing exposure across accounts is refused.
hedge_correlation_threshold: 0.60
