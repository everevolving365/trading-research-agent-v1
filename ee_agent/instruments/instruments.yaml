# The instrument registry. ALL asset behaviour lives here.
#
# Hard rule 5: no per-asset special cases anywhere in the codebase. If code
# anywhere branches on asset class to get a number, that number belongs in this
# file instead. A new instrument is a new entry here and nothing else.
#
# tick_value is in `currency` per one tick per one unit of size.
# sessions are local to `timezone`; `rth` is the regular session, `eth` the full one.

defaults:
  future:
    session: rth
    rollover: volume_crossover
    holiday_calendar: cme
  crypto:
    session: 24h
    timezone: UTC
    holiday_calendar: none
  equity:
    session: rth
    timezone: America/New_York
    holiday_calendar: nyse
  forex:
    session: 24h
    timezone: America/New_York
    holiday_calendar: fx

instruments:
  MNQ:
    name: Micro E-mini Nasdaq-100
    asset_class: future
    exchange: CME
    root: MNQ
    currency: USD
    tick_size: 0.25
    tick_value: 0.50
    multiplier: 2.0
    timezone: America/Chicago
    sessions:
      rth: {start: "08:30", end: "15:00"}
      eth: {start: "17:00", end: "16:00"}
    fees_per_side: 0.37       # exchange + clearing, typical prop pass-through
    margin_day: 100
    margin_overnight: 2200
    expiry: quarterly
    rollover_days_before: 8
    typical_daily_volume: 900000
    typical_daily_range_ticks: 800
    correlation_group: nasdaq
    prop_eligible: true

  NQ:
    name: E-mini Nasdaq-100
