<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EverEvolving Trading Agent</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --panel2:#1d212c; --line:#272c3a;
    --text:#e6e9ef; --dim:#8b93a7; --accent:#4c9aff; --good:#33c48d;
    --warn:#e5a13a; --bad:#e2574c; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f6; --line:#dfe3ea;
           --text:#12141a; --dim:#5f6878; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
         background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  .grow{flex:1}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel2);
        border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.ok{color:var(--good);border-color:#2b6b52}
  .pill.warn{color:var(--warn);border-color:#6b552b}

  main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
  @media (max-width:900px){ main{grid-template-columns:1fr} aside{display:none} }
  /* A narrow window is a real use: the header must not wrap into three lines
     and push the Send button off screen. */
  @media (max-width:700px){
    header{gap:8px;padding:8px 10px}
    header .sub{display:none}
    header h1{font-size:13px}
    #bVoice, #bReset{padding:7px 9px;font-size:12px}
    .quick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .quick button{flex:none}
    #log{padding:14px 12px}
    .msg{max-width:100%}
  }
  @media (max-width:430px){
    #bReset{display:none}
    #bVoice{font-size:0;padding:7px 10px}
    #bVoice::before{content:"🔈";font-size:14px}
  }

  #chat{display:flex;flex-direction:column;min-height:0;min-width:0}
  #log{flex:1;overflow-y:auto;padding:18px 20px;scroll-behavior:smooth}
  .msg{max-width:min(760px,92%);margin:0 0 16px;white-space:pre-wrap;word-wrap:break-word}
  .msg.me{margin-left:auto;background:var(--accent);color:#fff;padding:9px 13px;border-radius:14px 14px 3px 14px}
  .msg.agent{background:var(--panel);border:1px solid var(--line);padding:11px 14px;border-radius:14px 14px 14px 3px}
  .msg.sys{color:var(--dim);font-size:13px;border-left:2px solid var(--line);padding-left:11px;max-width:100%}
  .msg pre{background:var(--panel2);padding:10px;border-radius:7px;overflow-x:auto;
           font:12px/1.5 var(--mono);margin:8px 0}
  .tools{font:11px var(--mono);color:var(--dim);margin-top:7px}
  .tools b{color:var(--accent);font-weight:600}

  #composer{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:10px 14px}
  #row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--text);border:1px solid var(--line);
           border-radius:10px;padding:10px 12px;font:inherit;max-height:180px;min-height:44px}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;
         padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .quick button{padding:5px 10px;font-size:12px;border-radius:999px;color:var(--dim)}

  aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;min-width:0}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
           margin:18px 0 8px;font-weight:600}
  aside h2:first-child{margin-top:0}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
        font-size:12.5px;margin-bottom:8px;word-break:break-word}
  .card .k{color:var(--dim);font-size:11px}
  .feed{font:11px/1.6 var(--mono);color:var(--dim);max-height:230px;overflow-y:auto}
  .feed div{padding:2px 0;border-bottom:1px solid var(--line)}
  .feed .t{color:var(--accent)}
  .spend{font:600 20px var(--mono);color:var(--good)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.on{background:var(--good)} .dot.off{background:var(--dim)}
  .hint{color:var(--dim);font-size:11.5px;margin-top:6px;line-height:1.5}
  a{color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>EverEvolving Trading Agent</h1>
  <span class="sub">your strategy · your risk · proven identical everywhere</span>
  <span class="grow"></span>
  <span class="pill" id="pModel">model …</span>
  <span class="pill" id="pSpend">$0.0000</span>
  <button id="bVoice" title="Speak replies out loud">🔈 Voice off</button>
  <button id="bReset" title="Start a fresh conversation">Reset</button>
</header>

<main>
  <section id="chat">
    <div id="log"></div>
    <div id="composer">
      <div class="quick">
        <button data-say="What can you do? Give me the short version.">What can you do?</button>
        <button data-say="Run the demo: load MNQ from the fixtures, backtest the Sweep Return strategy, and prove parity across all four targets.">Run the demo</button>
        <button data-say="I want to tell you my strategy. Ask me whatever you need until you understand it completely.">Describe my strategy</button>
        <button data-say="Show me the SPY option chain for the nearest expiry, and tell me which contracts are actually tradeable.">Option chain</button>
        <button data-say="What has this session cost me so far, broken down by operation?">What has it cost?</button>
      </div>
      <div id="row">
        <textarea id="input" rows="1" placeholder="Tell it about your strategy, or ask it anything…"></textarea>
        <button class="mic" id="bMic" title="Hold a thought and speak (needs local Whisper)">🎤</button>
        <button class="primary" id="bSend">Send</button>
      </div>
    </div>
  </section>

  <aside>
    <h2>Spend</h2>
    <div class="card">
      <div class="spend" id="spendBig">$0.0000</div>
      <div class="k" id="spendNote">It tells you what things cost. It never refuses.</div>
    </div>

    <h2>Set up</h2>
    <div class="card" id="setup">checking…</div>

    <h2>Working on</h2>
    <div class="card" id="workspace">nothing loaded yet</div>

    <h2>What it just did</h2>
    <div class="feed" id="feed"></div>

    <h2>Positions</h2>
    <div class="card" id="positions">—</div>
  </aside>
</main>

<script>
const TOKEN = "{{TOKEN}}";
const $ = (id) => document.getElementById(id);
const log = $("log");
let busy = false, voiceOn = false, listening = false;

async function api(path, body, method) {
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"),
    headers: { "Content-Type": "application/json", "X-EE-Token": TOKEN },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function bubble(text, cls, tools) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  // Fence anything that looks like the agent's report output.
  const looksTabular = /^\s*\[|─|═|\|\s*$/m.test(text) && cls === "agent";
  el.innerHTML = looksTabular ? "<pre>" + esc(text) + "</pre>" : esc(text);
  if (tools && tools.length) {
    const t = document.createElement("div");
    t.className = "tools";
    t.innerHTML = "ran " + tools.map(x => "<b>" + esc(x) + "</b>").join(" · ");
    el.appendChild(t);
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function send(text) {
  if (busy) return;
  const message = (text !== undefined ? text : $("input").value).trim();
  if (!message) return;
  $("input").value = "";
  $("input").style.height = "auto";
  bubble(message, "me");
  busy = true; $("bSend").disabled = true;
  const thinking = bubble("thinking…", "sys");

  try {
    const out = await api("/api/chat", { message });
    thinking.remove();
    bubble(out.reply || "(no answer)", "agent", out.tools);
    if (out.workspace) $("workspace").textContent = out.workspace;
    refresh();
  } catch (err) {
    thinking.remove();
    bubble("The app could not reach the agent: " + err + "\nIs the window still running in your terminal?", "sys");
  } finally {
    busy = false; $("bSend").disabled = false; $("input").focus();
  }
}

async function refresh() {
  const [status, spend, activity] = await Promise.all([
    api("/api/status"), api("/api/spend"), api("/api/activity"),
  ]);

  $("pModel").textContent = status.model_ready ? "model: " + status.model : "no model key";
  $("pModel").className = "pill " + (status.model_ready ? "ok" : "warn");
  $("pSpend").textContent = "$" + Number(spend.total_usd).toFixed(4);
  $("spendBig").textContent = "$" + Number(spend.total_usd).toFixed(4);
  const ops = Object.entries(spend.by_operation || {});
  $("spendNote").textContent = ops.length
    ? ops.map(([k, v]) => k + " $" + Number(v).toFixed(4)).join(" · ")
    : "It tells you what things cost. It never refuses.";

  $("setup").innerHTML =
    '<div><span class="dot ' + (status.model_ready ? "on" : "off") + '"></span>Model — ' +
      (status.model_ready ? esc(status.model) : "none (everything but conversation still works)") + "</div>" +
    '<div><span class="dot ' + (status.voice_out ? "on" : "off") + '"></span>Voice out</div>' +
    '<div><span class="dot ' + (status.voice_in ? "on" : "off") + '"></span>Voice in (local Whisper)</div>' +
    '<div class="hint">' + status.keys_present.length + " key(s) stored, " +
      status.n_tools + " tools available." +
      (status.model_ready ? "" : "<br>Add a key: <code>ee-agent secrets set ANTHROPIC_API_KEY</code>") +
    "</div>";

  $("workspace").textContent = status.workspace || "nothing loaded yet";
  $("positions").textContent = status.positions || "—";

  $("feed").innerHTML = (activity.activity || []).slice(-40).reverse().map(a =>
    '<div><span class="t">' + esc(a.kind) + "</span> " +
    esc(String(a.text).slice(0, 90)) + "</div>").join("");
}

// ---- voice out
$("bVoice").onclick = async () => {
  const out = await api("/api/voice", { action: voiceOn ? "disable" : "enable" });
  voiceOn = !!out.enabled;
  $("bVoice").textContent = voiceOn ? "🔊 Voice on" : "🔈 Voice off";
  $("bVoice").classList.toggle("primary", voiceOn);
  if (out.note) bubble(out.note, "sys");
};

// ---- voice in (push to talk)
$("bMic").onclick = async () => {
  if (listening) return;
  listening = true;
  $("bMic").classList.add("on");
  $("bMic").textContent = "● listening";
  try {
    const out = await api("/api/voice", { action: "listen" });
    if (out.error) bubble(out.error, "sys");
    else if (out.text) send(out.text);
    else bubble("I did not catch anything.", "sys");
  } finally {
    listening = false;
    $("bMic").classList.remove("on");
    $("bMic").textContent = "🎤";
  }
};

$("bReset").onclick = async () => {
  await api("/api/reset", {});
  log.innerHTML = "";
  greet();
  refresh();
};

$("bSend").onclick = () => send();
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 180) + "px";
});
document.querySelectorAll(".quick button").forEach(b =>
  b.onclick = () => send(b.dataset.say));

function greet() {
  bubble(
    "I'm your trading agent.\n\n" +
    "Tell me about your strategy — as much detail as you like, in any order, rambling is fine. " +
    "I'll ask about anything you leave out until there's nothing ambiguous left.\n\n" +
    "You own the strategy and you own the risk. I don't invent either. I just make sure the " +
    "thing I backtest, the indicator I build, and the thing that trades your account are all " +
    "provably the same object.",
    "agent"
  );
}

greet();
refresh();
setInterval(refresh, 6000);
$("input").focus();
</script>
</body>
</html>
