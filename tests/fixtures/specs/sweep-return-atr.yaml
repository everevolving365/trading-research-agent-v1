spec_version: 1
id: sweep-return-v1
name: EE Sweep Return v1
author: owner
created: '2026-09-13'
source_transcript: library/sweep-return-v1/how-i-trade-it.md
universe:
  instruments:
  - MNQ
  - NQ
  - ES
  - BTCUSDT
  session: rth
  timezone: America/Chicago
context:
- id: opening_range
  type: session_range
  window:
    start: 08:30
    end: 09:30
signals:
  entry:
  - id: short
    timeframe: 5m
    side: short
    all_of:
    - type: range_break
      reference: opening_range
      side: high
      confirm: wick
    - type: return_inside
      reference: opening_range
      confirm: close
  - id: long
    timeframe: 5m
    side: long
    all_of:
    - type: range_break
      reference: opening_range
      side: low
      confirm: wick
    - type: return_inside
      reference: opening_range
      confirm: close
  invalidation:
  - type: session_end
    reference: signal_window
filters:
  time_windows:
  - start: 09:30
    end: '15:00'
    tz: America/Chicago
  max_trades_per_day: 2
risk:
  stop:
    type: atr
    value: 0.4256
  target:
    type: atr
    value: 0.8512
  size:
    method: fixed_contracts
    value: 1.0
  max_concurrent_positions: 1
  scale_in: false
execution:
  entry_order: market_on_close_of_signal_bar
  session_close_behavior: flatten
  on_overlapping_signal: ignore_new
  gap_behavior: fill_at_open
  bar_close_confirmation: true
costs:
  commission_per_side:
    unit: currency
    value: 2.0
  slippage:
    unit: ticks
    value: 1.0
  spread:
    unit: ticks
    value: 1.0
  slippage_model: volume_volatility
  exchange_fees_per_side:
    unit: currency
    value: 0.0
assumptions:
- id: a1
  question: Close fully inside the range, or just past the broken level?
  resolution: just past the broken level
  approved_by: owner
  alternatives:
  - close fully inside the range
  sensitivity: {}
- id: a2
  question: Does a break of the high and a return inside on the SAME bar count?
  resolution: yes, same-bar break and return is a valid signal
  approved_by: owner
  alternatives:
  - require the return on a later bar
  sensitivity: {}
- id: a3
  question: Both directions, or short-only?
  resolution: both -- a break of the high that returns inside is a short, a break of the low that returns
    inside is a long
  approved_by: owner
  alternatives:
  - short only
  sensitivity: {}
- id: portability:mnq
  question: Your risk is stated in units that differ per instrument. Convert to ATR multiples measured
    on MNQ so the same spec runs on any asset?
  resolution: 'risk.stop: 25.0 points -> 0.4256 ATR(14); risk.target: 50.0 points -> 0.8512 ATR(14)'
  approved_by: owner
  alternatives:
  - keep the original units and run this spec on one instrument only
  sensitivity:
    if_wrong: Stops and targets scale with each instrument's own volatility instead of being fixed. On
      a quiet day the stop is tighter than you intended; on a volatile day it is wider.
notes: 'Owner''s ruling, authoritative (Section 11): the original indicator and strategy .pine files are

  the same strategy. The only intended difference is that the strategy script waits for a candle

  close. This spec is built from the indicator''s logic as the reference behaviour, with bar-close

  confirmation applied to entries. The two original files are retained in original/ as a

  regression baseline; the signal-count delta between generated and original is reported in

  docs/STATUS.md for information only.

  '
