<!-- Mock of a generic export portal. FIXTURE: not any real venue and it talks
     to nothing. Exercises the Operator's login, field-fill, export, paywall and
     download path with no account anywhere. -->
<html><body>
  <input id="username" /><input id="password" type="password" />
  <button id="login-submit">Sign in</button>
  <div id="login-error"></div>
  <input id="symbol-filter" /><input id="start-date" /><input id="end-date" />
  <input id="date-from" /><input id="date-to" /><input id="symbols" /><input id="start" /><input id="end" />
  <input id="export-format" /><input id="export-timezone" /><input id="schema" />
  <button id="export-chart-data">Export</button>
  <button id="export-trades">Export trades</button>
  <button id="dataset-download">Download dataset</button>
  <button id="new-batch-job">New batch job</button>
  <button id="export-confirm">Confirm</button>
  <button id="submit-job">Submit</button>
  <button id="confirm-order">Confirm order</button>
  <a id="export-download" download>Download</a>
  <a id="download-csv" download>Download CSV</a>
  <a id="download-file" download>Download file</a>
  <a id="job-download" download>Download job</a>
  <div id="export-error"></div><div id="report-error"></div><div id="order-error"></div><div id="job-error"></div>
</body></html>
